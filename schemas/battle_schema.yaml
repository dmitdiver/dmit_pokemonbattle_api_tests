type: object

required:
  - status
  - data
  - next_page
  - pagination

additionalProperties: false

properties:
  status:
    type: string

  next_page:
    type: boolean

  pagination:
    type: object
    required:
      - page
      - per_page
      - total
      - total_pages
    additionalProperties: false
    properties:
      page:
        type:
          - integer
          - "null"
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer

  data:
    type: array
    items:
      type: object

      required:
        - id
        - date
        - winner
        - loser
        - loser_attack
        - winner_attack
        - attacking_pok_id
        - trainer_winner_id
        - trainer_loser_id
        - winner_pokemon
        - loser_pokemon

      additionalProperties: false

      properties:
        id:
          type: string

        date:
          type: string

        winner:
          anyOf:
             - type: integer
             - type: string

        loser:
          anyOf:
            - type: integer
            - type: string

        trainer_winner_id:
            type: string

        trainer_loser_id:
            type: string

        loser_attack:
          anyOf:
            - type: integer
            - type: string

        winner_attack:
          anyOf:
            - type: integer
            - type: string

        attacking_pok_id:
          type: string

        winner_pokemon:
          type: object
          required:
            - id
            - name
            - stage
            - photo_id
            - attack
            - status
            - trainer_id
            - in_pokeball
          additionalProperties: false
          properties:
            id:
              type: integer
            name:
              type: string
            stage:
              type: string
            photo_id:
              type: integer
            attack:
              type: integer
            status:
              type: integer
            trainer_id:
              type: string
            in_pokeball:
              type: integer

        loser_pokemon:
          type: object
          required:
            - id
            - name
            - stage
            - photo_id
            - attack
            - status
            - trainer_id
            - in_pokeball
          additionalProperties: false
          properties:
            id:
              type: integer
            name:
              type: string
            stage:
              type: string
            photo_id:
              type: integer
            attack:
              type: integer
            status:
              type: integer
            trainer_id:
              type: string
            in_pokeball:
              type: integer